<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeanIX Storage Explorer</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script type="module" src="/src/taskpane.ts"></script>
  </head>
  <body>
    <main class="pane">
      <h1>LeanIX Storage Explorer</h1>

      <section>
        <h2>Status</h2>
        <p id="auth-status">Checking Office...</p>
        <button id="sign-in-button" type="button">Sign in to LeanIX</button>
        <button id="sign-out-button" type="button" hidden>Sign out</button>
      </section>

      <section>
        <h2>Workspace</h2>
        <p id="workspace-status">Not connected</p>
      </section>

      <section>
        <label for="object-id">Storage Object</label>
        <input id="object-id" type="text" placeholder="/services/storage/..." />
        <button id="retrieve-button" type="button" disabled>Retrieve Object</button>
      </section>

      <section>
        <h2>Result</h2>
        <pre id="result-output">{}</pre>
        <button id="write-button" type="button" disabled>Write to Worksheet</button>
        <button id="test-write-button" type="button" disabled>Write Test Cell</button>
      </section>

      <p id="message" role="status"></p>
    </main>
  </body>
</html>
